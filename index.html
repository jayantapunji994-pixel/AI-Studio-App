<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080b16;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  background: #11182b;
  border-bottom: 1px solid #293450;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #8b75ff;
}

.status {
  color: #44e6a1;
  font-size: 12px;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 25px 16px;
}

h1 {
  text-align: center;
  margin-top: 35px;
  font-size: 32px;
}

.subtitle {
  text-align: center;
  color: #aab3c8;
  margin: 15px 0 35px;
}

.workspace {
  background: #11182b;
  padding: 20px;
  border-radius: 16px;
  border: 1px solid #293450;
}

textarea {
  width: 100%;
  height: 130px;
  background: #080d1c;
  color: white;
  border: 1px solid #384563;
  border-radius: 10px;
  padding: 15px;
  font-size: 16px;
  resize: vertical;
  outline: none;
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 9px;
  margin: 10px 5px 0 0;
  cursor: pointer;
  font-weight: bold;
}

.generate {
  background: #8065ff;
  color: white;
}

.voice {
  background: #25334e;
  color: white;
}

.download {
  background: #13a879;
  color: white;
}

h3 {
  margin: 25px 0 12px;
}

iframe {
  width: 100%;
  height: 350px;
  background: white;
  border: none;
  border-radius: 10px;
}

#code {
  width: 100%;
  height: 180px;
  margin-top: 10px;
  background: #050914;
  color: #72e9bd;
  padding: 12px;
  overflow: auto;
  white-space: pre-wrap;
  border-radius: 10px;
}

footer {
  text-align: center;
  color: #77839c;
  padding: 35px;
}
</style>
</head>

<body>

<header>
  <div class="logo">NEXORA AI</div>
  <div class="status">● SYSTEM ONLINE</div>
</header>

<div class="container">

<h1>Build Anything With AI</h1>

<p class="subtitle">
Create websites with your imagination.
</p>

<div class="workspace">

<textarea id="prompt"
placeholder="Describe your website... Example: Create a modern shopping website"></textarea>

<br>

<button class="generate" onclick="generate()">
Generate Website
</button>

<button class="voice" onclick="voiceInput()">
🎤 Voice Input
</button>

<h3>Live Preview</h3>

<iframe id="preview"></iframe>

<h3>Generated Code</h3>

<pre id="code">Your generated code will appear here.</pre>

<button class="download" onclick="downloadCode()">
Download HTML
</button>

</div>
</div>

<footer>
NEXORA AI © 2026 | Create Without Limits
</footer>

<script>

let generatedCode = "";

function generate() {

  let prompt = document.getElementById("prompt").value;

  if (!prompt.trim()) {
    alert("Please enter your idea first!");
    return;
  }

  generatedCode = `
<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#171b39,#513b91);
  color: white;
  text-align: center;
  padding: 50px 20px;
}
.card {
  max-width: 600px;
  margin: 50px auto;
  padding: 35px;
  background: #ffffff18;
  border-radius: 20px;
}
button {
  background: #a38aff;
  border: none;
  padding: 14px 25px;
  border-radius: 8px;
  color: white;
}
</style>
</head>
<body>
<div class="card">
<h1>Welcome to My Website</h1>
<p>${escapeHTML(prompt)}</p>
<button onclick="alert('Welcome!')">Get Started</button>
</div>
</body>
</html>`;

  document.getElementById("preview").srcdoc = generatedCode;

  document.getElementById("code").textContent = generatedCode;

}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, function(c) {
    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c];
  });
}

function voiceInput() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser.");
    return;
  }

  let recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.start();

  recognition.onresult = function(event) {
    document.getElementById("prompt").value =
      event.results[0][0].transcript;
  };
}

function downloadCode() {

  if (!generatedCode) {
    alert("Generate a website first!");
    return;
  }

  let blob = new Blob([generatedCode], {
    type: "text/html"
  });

  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "nexora-website.html";
  link.click();

  URL.revokeObjectURL(link.href);
}

</script>

</body>
</html>
