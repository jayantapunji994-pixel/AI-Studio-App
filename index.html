
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090911">
<style>
*{box-sizing:border-box}
body{margin:0;background:#090911;color:white;font-family:Arial,sans-serif}
header{padding:25px 20px;background:#11111e;border-bottom:1px solid #29243d}
.logo{font-size:27px;font-weight:bold;color:#b78aff}
header p{color:#aaa;margin-bottom:0}
main{padding:20px}
h2{font-size:23px}
.welcome{background:linear-gradient(135deg,#25134b,#111124);padding:23px;border-radius:18px;margin-bottom:25px}
.welcome h2{font-size:25px}
.welcome p{color:#c5b8dd;line-height:1.5}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tool{background:#171725;border:1px solid #302747;border-radius:15px;padding:18px 12px;color:white;text-align:left;cursor:pointer}
.tool span{font-size:25px}
.tool h3{font-size:15px;margin-bottom:5px}
.tool p{font-size:12px;color:#aaa}
.panel{background:#171725;border:1px solid #302747;border-radius:16px;padding:18px;margin-top:24px}
input,textarea,select{width:100%;padding:13px;margin:9px 0;background:#0d0d18;border:1px solid #39304d;border-radius:10px;color:white;font-size:15px}
textarea{height:100px;resize:vertical}
button{background:#8749df;color:white;border:0;padding:13px 18px;border-radius:10px;font-weight:bold;cursor:pointer}
#result{white-space:pre-wrap;line-height:1.6;color:#ddd;margin-top:15px}
nav{position:fixed;bottom:0;width:100%;background:#11111e;padding:15px;text-align:center;border-top:1px solid #302747;color:#b78aff}
</style>
</head>
<body>
<header>
<div class="logo">✦ AI STUDIO</div>
<p>Your creative AI workspace</p>
</header>
<main>
<div class="welcome">
<h2>Welcome to AI Studio 👋</h2>
<p>Create captions, bios and creative content with your AI workspace.</p>
</div>
<h2>Explore AI Tools</h2>
<div class="tools">
<button class="tool" onclick="openTool('Caption Generator')"><span>✍️</span><h3>Caption Generator</h3><p>Create captions</p></button>
<button class="tool" onclick="openTool('Bio Generator')"><span>👤</span><h3>Bio Generator</h3><p>Make stylish bios</p></button>
<button class="tool" onclick="openTool('Text Writer')"><span>📝</span><h3>AI Text Writer</h3><p>Write creative text</p></button>
<button class="tool" onclick="openTool('Hashtag Generator')"><span>#️⃣</span><h3>Hashtag Generator</h3><p>Find hashtags</p></button>
</div>
<div class="panel" id="panel">
<h2 id="toolTitle">Try Your AI Tools</h2>
<p style="color:#aaa">Select a tool and enter your topic.</p>
<input id="topic" placeholder="Enter your topic...">
<button onclick="generate()">Generate ✨</button>
<div id="result"></div>
</div>
</main>
<nav>✦ AI STUDIO &nbsp; | &nbsp; Create Something Amazing</nav>
<script>
let selected="Caption Generator";
function openTool(name){
selected=name;
document.getElementById("toolTitle").innerText=name;
document.getElementById("result").innerText="";
document.getElementById("topic").placeholder="Enter your "+name.toLowerCase()+" topic...";
document.getElementById("panel").scrollIntoView({behavior:"smooth"});
}
function generate(){
let topic=document.getElementById("topic").value.trim();
if(!topic){alert("Please enter a topic");return;}
let output="";
if(selected==="Caption Generator"){
output="✨ "+topic+" — Every moment tells a story. Make yours unforgettable! ❤️";
}else if(selected==="Bio Generator"){
output="✨ "+topic+"\n🌍 Creating my own journey\n🚀 Dream big. Stay original.";
}else if(selected==="Text Writer"){
output="Welcome to "+topic+"! Explore new ideas, express your creativity and make every moment count.";
}else{
output="#"+topic.replace(/\s+/g,"")+" #Trending #Explore #Inspiration #Creative";
}
document.getElementById("result").innerText=output;
}
</script>
</body>
</html>
